[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensenova-loop"
version = "0.1.0"
description = "Text and image understanding inference for SenseNova-Loop-9B-Preview"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.18.0",
    "accelerate>=1.11,<2",
    "safetensors>=0.8,<1",
    "pillow>=12,<13",
    "packaging>=24,<27",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sensenova-loop = "sensenova_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a local checkpoint and a CUDA GPU (opt in with SENSENOVA_LOOP_MODEL)"]
